services:
  brickbuddy:
    image: ${DOCKERHUB_USERNAME:-local}/${DOCKERHUB_REPOSITORY:-brickbuddy}:${IMAGE_TAG:-latest}
    build:
      context: .
    container_name: brickbuddy
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/legolist.db
      REBRICKABLE_API_KEY: ${REBRICKABLE_API_KEY:-}
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Copie de la base avant une mise à jour : docker compose run --rm backup
  backup:
    image: ${DOCKERHUB_USERNAME:-local}/${DOCKERHUB_REPOSITORY:-brickbuddy}:${IMAGE_TAG:-latest}
    build:
      context: .
    command: ["python", "-m", "brickbuddy.backup"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/legolist.db
    volumes:
      - ./data:/data
