<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Connexion · LEGO</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg', v=2) }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=8) }}">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand login-brand" href="{{ url_for('login') }}"><span class="brand-mark">B</span><span>brick<span class="brand-light">buddy</span></span></a>
    <div class="eyebrow">MON ATELIER</div>
    <h1>Bon retour</h1>
    <p class="login-description">Entre le mot de passe pour accéder à ta collection.</p>
    {% if config_error %}
      <p class="login-message error" role="alert">{{ config_error }}</p>
    {% else %}
      {% if error %}<p class="login-message error" role="alert">{{ error }}</p>{% endif %}
      <form class="login-form" action="{{ url_for('login') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_target }}">
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button class="button button-primary" type="submit">Se connecter <span>→</span></button>
      </form>
    {% endif %}
    <p class="login-footer">Accès privé · Brick Buddy</p>
  </main>
</body>
</html>
